[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "feedverdict"
version = "0.1.3"
description = "An explainable multi-source cryptocurrency price reconciliation agent."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Yassin Aghil" }]
dependencies = [
    "InquirerPy>=0.3.4,<1",
]

[project.scripts]
feedverdict = "feedverdict.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
